<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지를 찾을 수 없습니다 — Inhalt</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #121212;
      --white: #ffffff;
      --ink2:  #1a1a1a;
      --muted: #555555;
      --line:  #e5e3dc;
      --font:  'Pretendard', -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font);
      background: var(--white);
      color: var(--ink2);
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrap {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .mark {
      width: 44px;
      height: 74px;
      margin: 0 auto 32px;
      opacity: 0.85;
      color: var(--black);
    }
    .mark svg { display: block; width: 100%; height: 100%; }

    h1 {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      padding: 0 28px;
      border-radius: 9999px;
      background: var(--black);
      color: var(--white);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .btn:hover { background: #333333; }

    @media (prefers-color-scheme: dark) {
      body { background: var(--black); color: var(--white); }
      .mark { color: var(--white); }
      p { color: #aaaaaa; }
      .btn { background: var(--white); color: var(--black); }
      .btn:hover { background: #dddddd; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <svg viewBox="0 0 28 47" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.65008 40.5432C-1.3633 36.2493 -2.51492 25.4505 2.57141 18.4329C6.95398 12.7771 13.6558 9.49263 19.9097 6.35233C22.7408 5.10261 25.8758 7.44182 26.3396 10.2937C27.5072 16.8307 28.163 23.5759 26.7075 30.1289C24.6922 38.7007 14.9673 44.9973 6.65008 40.5432ZM7.60976 38.8288C14.8714 42.3056 22.4049 36.6819 24.4362 29.472C25.8758 23.9124 25.6199 17.7439 25.076 12.0401C24.6602 6.94514 21.7331 6.28824 17.6545 8.65949C12.5361 11.3031 7.04995 14.5395 3.72304 19.234C-0.611543 25.5627 0.348142 35.1438 7.60976 38.8288Z" fill="currentColor"/><path d="M17.9572 27.2771C17.9572 27.2771 16.4857 34.8555 10.9355 37.2588L17.9572 27.2771Z" fill="currentColor"/><path d="M14.1348 37.9962C14.1348 37.9962 24.0835 29.0879 25.2351 12.2008C25.2351 12.2008 27.2185 33.8304 14.1348 37.9962Z" fill="currentColor"/><path d="M11.7519 15.5654C11.7519 15.5654 3.53056 21.798 1.45124 35.4647C1.45124 35.4647 -0.436137 22.2786 11.7519 15.5654Z" fill="currentColor"/></svg>
    </div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 잘못되었거나, 이동 또는 삭제된 페이지예요.<br>아래 버튼을 눌러 홈으로 돌아가주세요.</p>
    <a href="/" class="btn">홈으로 돌아가기</a>
  </div>
</body>
</html>
